# Source view → Supabase landing table mapping.
# Columns are pushed positionally-by-name: the SQL Server view's PascalCase
# column FooBarID lands in snake_case foo_bar_id (see column_map exceptions).
# Load pattern: COPY into etl_stage.<table>, then DELETE + INSERT…SELECT into
# erp.<table> in one short transaction (no exclusive lock on the live table).

tables:
  - source_view: bi.vw_DimCustomer
    target_table: erp.dim_customer
  - source_view: bi.vw_DimShipTo
    target_table: erp.dim_ship_to
  - source_view: bi.vw_DimSalesRep
    target_table: erp.dim_sales_rep
  - source_view: bi.vw_DimPart
    target_table: erp.dim_part
  - source_view: bi.vw_FactOrderLine
    target_table: erp.fact_order_line
  - source_view: bi.vw_FactInvoiceLine
    target_table: erp.fact_invoice_line
  - source_view: bi.vw_FactShipmentLine
    target_table: erp.fact_shipment_line
  - source_view: bi.vw_FactInventoryOnHand
    target_table: erp.fact_inventory_on_hand
  # ERP contact assignments (migration 032 must be applied before this entry
  # first runs — truncate+COPY fails on a missing table). Merged with
  # rep-entered public.contacts by public.v_account_contacts.
  - source_view: bi.vw_DimCustomerContact
    target_table: erp.dim_customer_contact
  # ATS list (migration 032). Replaces the never-created bi.vw_FactATS /
  # erp.fact_ats pair from 027 — vw_FactAvailableToSell is the certified
  # ATS model (grain: part+site).
  - source_view: bi.vw_FactAvailableToSell
    target_table: erp.fact_available_to_sell

# Generated columns in the target (order_date, ship_date, …) are computed by
# Postgres — the ETL must NOT include them in the column list.

# PascalCase → snake_case exceptions the naive splitter gets wrong:
column_map:
  SICCode: sic_code
  UPC: upc
  RMAID: rma_id
  COGSAmount: cogs_amount
  COGSMaterial: cogs_material
  COGSLabor: cogs_labor
  COGSBurden: cogs_burden
  COGSService: cogs_service
  FFLLicenseNumber: ffl_license_number
  FFLExpirationRaw: ffl_expiration_raw
  ARTermsRuleID: ar_terms_rule_id
  ARPaymentMethodID: ar_payment_method_id
  ARActiveFlag: ar_active_flag
  MRPRequiredFlag: mrp_required_flag
  QtyAvailableMRP: qty_available_mrp
  LinkedInURL: linkedin_url

# The tables post_load_sql reads. Post-load runs on a full run when every
# table listed here loaded in THIS run, even if another table failed: one
# feed nothing downstream reads (contacts, ATS, inventory) must not freeze
# every rollup, the account signals and the AI batch while the facts keep
# moving (October 2026: ten days of a stale Overview over current
# invoices). If any of these failed, post-load is skipped, so the rollups
# are never rebuilt over a mix of old and new copies of the tables they
# combine. Either way a failed table still logs the night's etl:run as an
# error (the freshness stamp's data_loaded_at does not move) and the exit
# code is still 1.
# Delete the key and every table is required again (the old rule).
#
# When you add a post_load_sql step or change one of its functions, check
# what it reads and add the table here. Verified against the latest
# definitions on 2026-10-13:
post_load_requires:
  # refresh_territory_rollups (20261013150002): the account rollup is built
  # per dim_customer row. refresh_account_signals (023): the active,
  # non-internal, not-deactivated accounts every score is computed for.
  - erp.dim_customer
  # refresh_account_signals (023): product_family for families dropped.
  # run_order_qc (20260817000200): part_id when comparing ERP lines with
  # portal order lines.
  - erp.dim_part
  # refresh_territory_rollups: revenue for all four erp.agg_* rollups.
  # refresh_account_signals: 12/24-month revenue and product families.
  - erp.fact_invoice_line
  # refresh_territory_rollups: backlog, open orders, bookings and last order
  # date in agg_account_rollup. refresh_account_signals: order cadence and
  # backlog. capture_order_changes (20261013150003): the whole diff against
  # last night's snapshot. run_order_qc: the ERP side of every comparison.
  - erp.fact_order_line
  # capture_order_changes: tracking numbers for lines shipped since the
  # snapshot. The snapshot is replaced every run, so tracking missed on a
  # stale shipment table is never picked up later.
  - erp.fact_shipment_line
# Not read by any post-load step: erp.dim_ship_to, erp.dim_sales_rep,
# erp.fact_inventory_on_hand, erp.dim_customer_contact,
# erp.fact_available_to_sell (generate_recommendations, apply_account_scores
# and analyze_territory_rollups read only what the steps above produce).
# post_load_http runs after a post-load whose required steps succeeded. The
# AI batch reads what those steps rebuilt, plus the same live tables the app
# reads (ATS, for one). A table that failed tonight is yesterday's copy there,
# the same as everywhere else in the app.

# After the tables load (all of them, or every table in post_load_requires —
# see above), run:
#
# The flag gate lives at the CALL SITE (migration 024): while
# feature.recommendations is disabled, the SRF in the generate_recommendations()
# statement's select list is never evaluated, so the nightly run mints
# nothing — and the gate survives any rewrite of the function itself.
# Flipping the flag back on resumes generation on the next load.
#
# When generation IS enabled it stays ONE statement, deliberately:
# generate_recommendations() refreshes the account signals and applies the
# scores itself as its first step (migration 020), so scoring and generation
# cannot run out of order. The two statements after it cover the flag-OFF night:
# signals still refresh and scores still apply (the Today card, admin tuning
# and future re-enable all read them) — only recommendation rows stop.
post_load_sql:
  # A plain string is a REQUIRED step: an exception stops the list there and
  # logs the night's etl:run as an error (the freshness stamp does not move).
  # `{sql: ..., optional: true}` is housekeeping: a failure is logged as
  # etl:post_load and the list carries on (push_to_supabase.py
  # post_load_steps) — so a step whose migration is not applied yet, or a
  # bad night for it, never holds back the stamp.
  #
  # First, always: rebuild the territory rollups (migration 030) so the
  # Overview and the AI brief read tonight's data. This must precede the
  # recommendation/scoring statements — an exception in a required step
  # stops the list, and stale recommendations are survivable where a stale
  # Overview is the first thing every rep sees.
  - "select * from public.refresh_territory_rollups();"
  # Fresh planner statistics for the four rollups the refresh just rebuilt
  # with DELETE + INSERT (migration 20261013150002 — no more TRUNCATE
  # locking readers out), before anything below reads them. A function
  # rather than a bare ANALYZE because the loader fetches a result from
  # every step; ANALYZE (unlike VACUUM) is fine inside the step's
  # transaction.
  - sql: "select * from public.analyze_territory_rollups();"
    optional: true
  - "select public.generate_recommendations() where exists (select 1 from public.app_settings s where s.setting_key = 'feature.recommendations' and s.enabled);"
  - "select public.refresh_account_signals() where not exists (select 1 from public.app_settings s where s.setting_key = 'feature.recommendations' and s.enabled);"
  - "select public.apply_account_scores() where not exists (select 1 from public.app_settings s where s.setting_key = 'feature.recommendations' and s.enabled);"
  # What changed on the order book tonight — new orders, shipped backorders,
  # slipped promise dates (migration 20261013150003). The function catches
  # its own errors (logged as etl:order_changes); optional here as well, for
  # a database where the migration is not applied yet.
  - sql: "select public.capture_order_changes();"
    optional: true
  # Last: compares entered portal orders against tonight's
  # erp.fact_order_line load (migration 20260817000200) and flags
  # discrepancies. An exception here must never block the rollups above,
  # and with nothing after it, it stops nothing else. The flag gate at the
  # call site matches the recommendations pattern.
  - "select public.run_order_qc() where exists (select 1 from public.app_settings s where s.setting_key = 'feature.orders' and s.enabled);"

# Then pre-generate the account briefings for the top of each rep's book (by
# account_signals.score — no recommendation needed since 20261013140000).
# Needs SUPABASE_URL and AI_BATCH_SECRET in the ETL's environment; skipped
# with a warning when they are absent, because a missing summary must never
# fail a successful data load.
#
# Small calls, repeated: each call pays for at most max_accounts briefings
# (and stops starting new ones after ~75 s), so one request stays well inside
# the Edge Function time limit. repeat_until_idle calls again while the reply
# says generated + checked > 0 (checked: accounts looked at and found
# unchanged, too thin or failing — stamped so the next call moves on), up to
# 8 calls (120 briefings) a night. Runs after the etl:run row is logged, so
# the freshness stamp never waits on it.
post_load_http:
  - function: ai-summary-batch
    body: { per_rep: 5, max_accounts: 15 }
    repeat_until_idle: 8
