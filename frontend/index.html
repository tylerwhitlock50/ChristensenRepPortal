<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= is a cache-buster, not a file: browsers key their favicon cache
         on the URL and never revalidate it, so the RP monogram (b067e95)
         stayed the purple template bolt in every tab that had seen it. Bump it
         whenever favicon.svg changes, after `node scripts/render-icons.mjs`. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12130F" />
    <meta name="color-scheme" content="light" />
    <!-- Installed to an iPhone home screen: the icon, the name under it, and
         a black status bar above the ink header. The manifest link is added
         by vite-plugin-pwa (vite.config.ts). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-title" content="Rep Portal" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Every screen's first request goes to Supabase. Open that connection
         (DNS + TLS, several round trips on LTE) while the JS downloads,
         instead of after it has run. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
    <title>Rep Portal</title>
    <!-- The boot screen below, styled here because it has to paint before
         the app's own stylesheet and script have arrived. Colors are the
         style.css tokens (ink, canvas, line, accent). -->
    <style>
      .boot {
        min-height: 100svh;
        background: #f4f2ed;
      }
      .boot-bar {
        background: #12130f;
      }
      .boot-frame {
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 64rem;
        height: 56px;
        margin: 0 auto;
        padding: 0 16px;
      }
      .boot-tick {
        width: 3px;
        height: 16px;
        background: #c9662a;
      }
      .boot-mark {
        color: #f4f2ed;
        font: 700 17px/1 'Barlow Condensed', 'Barlow', sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .boot-body {
        max-width: 64rem;
        margin: 0 auto;
        padding: 20px 16px;
      }
      .boot-line {
        width: 55%;
        height: 28px;
        margin-bottom: 16px;
        background: #e6e3dc;
      }
      .boot-block {
        height: 112px;
        margin-bottom: 16px;
        border: 1px solid #dfdbd2;
        background: #fff;
      }
      /* Sign-in and reset render without the app header: sign-in opens on a
         dark hero, reset on plain canvas. */
      [data-boot='login'] .boot {
        background: linear-gradient(#12130f 0 38svh, #f4f2ed 38svh);
      }
      [data-boot] .boot-bar,
      [data-boot] .boot-body {
        display: none;
      }
      @media (prefers-reduced-motion: no-preference) {
        .boot-line,
        .boot-block {
          animation: boot-pulse 1.6s ease-in-out infinite;
        }
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.55;
        }
      }
    </style>
    <script>
      ;(function (path) {
        if (path === '/login' || path === '/reset-password') {
          document.documentElement.setAttribute('data-boot', path.slice(1))
        }
      })(location.pathname)
    </script>
  </head>
  <body>
    <!-- Replaced wholesale when the app mounts. Until then the rep sees the
         app's own frame instead of a white page. -->
    <div id="app">
      <div class="boot" aria-busy="true">
        <div class="boot-bar">
          <div class="boot-frame">
            <span class="boot-tick"></span>
            <span class="boot-mark">Rep Portal</span>
          </div>
        </div>
        <div class="boot-body">
          <div class="boot-line"></div>
          <div class="boot-block"></div>
          <div class="boot-block"></div>
          <div class="boot-block"></div>
        </div>
        <span
          style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"
          >Loading</span
        >
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
